#
# vLLM emulator overlay — runs on CPU-only nodes without /dev/kfd or /dev/dri.
#
# Uses the existing rocm-aic image but overrides the entrypoint with
# monitoring/scripts/vllm_emulator_server.py (mounted read-only at runtime).
# The emulator models timing mathematically and skips GPU kernel launches, so
# the OpenAI /v1/completions API and /metrics endpoint are fully functional
# without real GPU hardware.
#
# Usage:
#   # from the repo root:
#   docker compose -f docker/docker-compose.emulator.yml up
#
# Required env:
#   (none — defaults work for basic smoke testing)
#
# Optional env:
#   IMAGE_NAME      — rocm-aic image tag to use (default: rocm-aic)
#   VLLM_CPU_MODEL  — model to pass to LLMEmulator (default: facebook/opt-125m)
#   HF_HOME         — host HF cache dir (default: ~/.cache/huggingface)

services:

  vllm-emulator:
    image: ${IMAGE_NAME:-rocm-aic}
    container_name: aic-vllm-emulator
    ports:
      - "8000:8000"   # OpenAI API + /metrics (same port as production vllm)
    # No devices: block — no /dev/kfd or /dev/dri needed for CPU emulation.
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf
      # Mount the wrapper script from the monitoring/scripts tree so no image
      # rebuild is needed when the script changes.
      - ../monitoring/scripts/vllm_emulator_server.py:/app/vllm_emulator_server.py:ro
    environment:
      - VLLM_MODEL=${VLLM_CPU_MODEL:-facebook/opt-125m}
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - PYTHONUNBUFFERED=1
    entrypoint: ["python3", "/app/vllm_emulator_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
