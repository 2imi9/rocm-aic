# Recording rules adapted from the batesste Ansible monitoring roles. They
# synthesize stable join keys (instance@device[@port]) so NVMe and RDMA series
# from different exporters can be correlated when exploring the captured TSDB.

groups:
  - name: aic_join
    interval: 30s
    rules:
      # NVMe device key: instance@device, gated on node_exporter disk info.
      - record: aic:nvme:key
        expr: |
          max by (job, instance, device, k) (
            label_join(
              node_disk_info{job="node_exporter", device=~"nvme.*"},
              "k", "@", "instance", "device"
            ) * 0 + 1
          )

      # vLLM KV cache blocks currently in use.
      # num_gpu_blocks is a string label on vllm:cache_config_info (value=1), not a
      # numeric metric, so we can't compute this in pure PromQL. The Grafana panel
      # uses a calculateField transform (Value × num_gpu_blocks label) instead.
      # This rule records the usage ratio joined with block metadata for alerting use.
      - record: aic:vllm:kv_cache_usage_with_blocks
        expr: |
          vllm:kv_cache_usage_perc{job="vllm"}
          * on(instance, engine, job) group_left(num_gpu_blocks)
          vllm:cache_config_info{job="vllm"}

      # RDMA port key: instance@device@port, from the yuuki-style rdma_exporter.
      - record: aic:rdma:key
        expr: |
          max by (job, instance, device, port, k) (
            label_join(
              rdma_port_rcv_data_total{job="rdma_exporter"},
              "k", "@", "instance", "device", "port"
            ) * 0 + 1
          )
